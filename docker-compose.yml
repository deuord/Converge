services:
  db:
    image: postgres:18.6-trixie
    container_name: mini-agent-copy-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent123
      POSTGRES_DB: mini_agent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d mini_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
